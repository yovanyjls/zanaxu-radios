<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zanaxú Radios</title>
  <meta name="description"
        content="Live radio apps for Android by Zanaxú.">

  <style>
    :root {
      color-scheme: light;
      --bg: #f4f0e6;
      --card: #fffcf5;
      --text: #203d35;
      --muted: #526158;
      --accent: #9a3f24;
      --border: #b8c5b9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    header,
    main,
    footer {
      width: 100%;
      max-width: 64rem;
      min-width: 0;
      margin-inline: auto;
    }

    header {
      padding: 48px 16px 24px;
      text-align: center;
    }

    .bars {
      height: 32px;
      margin-bottom: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
    }

    .bars i {
      display: block;
      width: 6px;
      border-radius: 3px;
      background: var(--accent);
    }

    .bars i:nth-child(1) { height: 16px; }
    .bars i:nth-child(2) { height: 26px; }
    .bars i:nth-child(3) { height: 20px; }
    .bars i:nth-child(4) { height: 32px; }
    .bars i:nth-child(5) { height: 22px; }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3rem);
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    header p {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 1.05rem;
    }

    main { padding: 16px; }

    #radios {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    #radios > li {
      display: flex;
      flex: 0 0 14rem;
      min-width: 0;
      max-width: 100%;
    }

    .radio {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-width: 0;
      padding: 20px 16px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--card);
      color: var(--text);
      text-align: center;
      text-decoration: none;
      box-shadow: 0 2px 4px rgb(32 61 53 / 6%);
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    .radio:hover {
      border-color: var(--accent);
      box-shadow: 0 4px 12px rgb(32 61 53 / 12%);
    }

    a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }

    .artwork {
      display: grid;
      place-items: center;
      flex: none;
      width: 128px;
      max-width: 100%;
    }

    .artwork img {
      display: block;
      width: 128px;
      max-width: 100%;
      height: auto;
      aspect-ratio: 1;
      object-fit: contain;
      filter: drop-shadow(0 3px 3px rgb(32 61 53 / 28%));
    }

    .radio h2 {
      width: 100%;
      margin: 0;
      font-size: 1rem;
      font-weight: 650;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .store {
      margin-top: auto;
      padding-top: 4px;
      color: var(--accent);
      font-size: 0.875rem;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    #status,
    .notice {
      margin: 0;
      color: var(--muted);
      text-align: center;
    }

    footer {
      margin-top: auto;
      padding: 40px 16px 24px;
      color: var(--muted);
      text-align: center;
      font-size: 0.9375rem;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px 24px;
    }

    footer a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      max-width: 100%;
      min-height: 44px;
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    footer p { margin: 12px 0 0; }

    /* Phones: two per row; an odd last radio stays centered. */
    @media (max-width: 40rem) {
      #radios { gap: 12px; }
      #radios > li { flex-basis: calc(50% - 6px); }
      .radio { padding: 16px 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .radio { transition: none; }
    }
  </style>
</head>

<body>
  <header>
    <div class="bars" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i>
    </div>
    <h1>Zanaxú Radios</h1>
    <p>Live radio apps for Android.</p>
  </header>

  <main>
    <p id="status" role="status" aria-atomic="true"></p>
    <ul id="radios" role="list" aria-label="Radio apps"></ul>
    <noscript>
      <p class="notice">
        Enable JavaScript to load the radios, or browse all our apps
        on Google Play below.
      </p>
    </noscript>
  </main>

  <footer>
    <nav class="footer-links" aria-label="Footer">
      <a href="https://play.google.com/store/apps/developer?id=Zanax%C3%BA">
        All our apps on Google Play
      </a>
      <a href="https://yovanyjls.github.io/app-privacy-policy/zanaxu-apps/">
        Privacy policy
      </a>
    </nav>
    <p>&copy; Zanaxú</p>
  </footer>

  <script>
    async function loadRadios() {
      const list = document.getElementById("radios");
      const status = document.getElementById("status");
      status.textContent = "Loading radios…";
      list.setAttribute("aria-busy", "true");

      try {
        const response = await fetch("radios.json", { cache: "no-cache" });
        if (!response.ok) throw new Error("Could not fetch radios.");

        const feed = await response.json();
        if (!feed || !Array.isArray(feed.radios) ||
            !feed.radios.every(radio =>
              radio && ["name", "package", "icon"].every(key =>
                typeof radio[key] === "string" && radio[key].trim()
              )
            )) {
          throw new Error("Invalid radio list.");
        }

        const fragment = document.createDocumentFragment();

        // Keep the JSON order: newest first.
        feed.radios.forEach((radio, index) => {
          const item = document.createElement("li");
          const link = document.createElement("a");
          link.className = "radio";
          link.href = "https://play.google.com/store/apps/details?id=" +
            encodeURIComponent(radio.package);

          const artwork = document.createElement("span");
          artwork.className = "artwork";

          const icon = document.createElement("img");
          icon.src = radio.icon;
          icon.alt = "";
          icon.width = 128;
          icon.height = 128;
          icon.loading = index < 4 ? "eager" : "lazy";
          icon.decoding = "async";
          artwork.append(icon);

          const name = document.createElement("h2");
          name.textContent = radio.name;

          const store = document.createElement("span");
          store.className = "store";
          store.textContent = "Get it on Google Play";

          link.append(artwork, name, store);
          item.append(link);
          fragment.append(item);
        });

        list.replaceChildren(fragment);
        status.textContent = feed.radios.length
          ? ""
          : "No radio apps are available yet.";
      } catch {
        status.textContent =
          "Could not load the radios. Please try again later.";
      } finally {
        list.setAttribute("aria-busy", "false");
      }
    }

    loadRadios();
  </script>
</body>
</html>
